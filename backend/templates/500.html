<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error | INT253 Error Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #FFF8F0; color: #30231F; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(62, 39, 35, 0.1); border: 1px solid #E8D8C8; max-width: 580px; }
        .btn-chocolate { background-color: #6D4C41; color: white; }
    </style>
</head>
<body>
    <div class="card error-card text-center p-4 m-3">
        <div class="card-body">
            <i class="bi bi-x-octagon-fill text-danger display-1 mb-3"></i>
            <h1 class="display-6 fw-bold">500 - Internal Server Error</h1>
            <p class="text-muted">
                An unexpected condition was encountered by the Django application.
            </p>
            <div class="alert alert-secondary text-start small mb-4">
                <strong>INT253 Unit II Error Handling Concept:</strong>
                <br>This page demonstrates production-safe error masking via <code>handler500 = 'django_demo.views.custom_500_view'</code>.
            </div>
            <a href="/django-demo/" class="btn btn-chocolate px-4">
                Return to HostelEase
            </a>
        </div>
    </div>
</body>
</html>
